name: brew formula update

on:
  repository_dispatch:
    types: [brew-formula-update]
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: 'Optional prefix for the release tag (leave empty for unified tags like v2.0.3)'
        default: ''
        required: false
        type: string
      tag_version:
        description: 'Tag to pull'
        required: true
        type: string

permissions: {}

jobs:
  update-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Exchanged with octo-sts for the formula-update token.
      id-token: write
    env:
      INPUT_TAG: ${{ github.event.client_payload.tag_version || inputs.tag_version }}
      INPUT_PREFIX: ${{ github.event.client_payload.tag_prefix || inputs.tag_prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize inputs
        id: ver
        run: |
          set -euo pipefail
          version="${INPUT_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag_version must be X.Y.Z or vX.Y.Z, got '${INPUT_TAG}'"
            exit 1
          fi
          prefix="${INPUT_PREFIX}"
          while [[ "$prefix" == -* ]]; do prefix="${prefix#-}"; done
          while [[ "$prefix" == *- ]]; do prefix="${prefix%-}"; done
          if [[ ! "$prefix" =~ ^[a-z0-9-]*$ ]]; then
            echo "::error::tag_prefix must be lowercase letters, digits and dashes, got '${INPUT_PREFIX}'"
            exit 1
          fi
          release_name="v${version}"
          if [[ -n "$prefix" ]]; then
            release_name="${prefix}-v${version}"
          fi
          {
            echo "version=${version}"
            echo "release_name=${release_name}"
          } >> "$GITHUB_OUTPUT"

      # Releases can land out of order (a patch on an older minor after a
      # newer minor), and the tap tracks only the newest.
      - name: Skip versions the formula already covers
        id: newer
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          current="$(grep -oE 'releases/download/[^/]*v[0-9]+\.[0-9]+\.[0-9]+/' Formula/wash.rb \
            | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          newest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)"
          if [[ "$VERSION" == "$current" || "$newest" != "$VERSION" ]]; then
            echo "::notice::Formula is at ${current}; not moving it to ${VERSION}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release artifacts
        if: steps.newer.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ steps.ver.outputs.release_name }}
        run: |
          gh -R wasmCloud/wasmCloud release download "$RELEASE_NAME" -D tmp/ -p '*apple-darwin*' -p '*unknown-linux-gnu'

      - name: Generate formula
        if: steps.newer.outputs.skip == 'false'
        env:
          RELEASE_NAME: ${{ steps.ver.outputs.release_name }}
        run: ./generate-formula.sh "$RELEASE_NAME"

      # An app token (not GITHUB_TOKEN) so the PR runs test-bot without a
      # maintainer approving the run, and can queue its own auto-merge.
      - name: Get a formula-update token from octo-sts
        if: steps.newer.outputs.skip == 'false'
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: formula-update

      - name: Create Pull Request
        if: steps.newer.outputs.skip == 'false'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          commit-message: bump wash to v${{ steps.ver.outputs.version }}
          title: wash v${{ steps.ver.outputs.version }}
          body: |
            This is the release of wash v${{ steps.ver.outputs.version }}.

            Auto-merge is queued: this PR merges itself once `brew test-bot` passes on macOS and Linux. If a check fails, the formula stays at its current version until this PR is fixed or superseded.
          branch: release/${{ steps.ver.outputs.release_name }}
          author: octo-sts[bot] <157150467+octo-sts[bot]@users.noreply.github.com>
          committer: octo-sts[bot] <157150467+octo-sts[bot]@users.noreply.github.com>
          signoff: true

      - name: Queue auto-merge
        if: steps.newer.outputs.skip == 'false' && steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch

      - name: Close superseded formula PRs
        if: steps.newer.outputs.skip == 'false' && steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release/")) | "\(.number) \(.headRefName)"' |
          while read -r number branch; do
            old="${branch##*v}"
            if [[ "$number" == "$PR" || ! "$old" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            if [[ "$(printf '%s\n%s\n' "$old" "$VERSION" | sort -V | tail -1)" == "$VERSION" ]]; then
              gh pr close "$number" --repo "$GITHUB_REPOSITORY" --delete-branch \
                --comment "Superseded by #${PR} (wash v${VERSION})."
            fi
          done
