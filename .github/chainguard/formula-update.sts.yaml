# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

issuer: https://token.actions.githubusercontent.com
subject: repo:wasmCloud/homebrew-wasmcloud:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: wasmCloud/homebrew-wasmcloud/.github/workflows/update.yml@refs/heads/main

# Push the release/* branch, open its PR, queue its auto-merge, and close
# the formula PRs it supersedes. An app token, unlike GITHUB_TOKEN, lets
# that PR run test-bot without a maintainer approving the run.
permissions:
  contents: write
  pull_requests: write
